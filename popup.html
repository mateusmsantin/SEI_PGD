<!doctype html>
<html lang="pt-br"><head><meta charset="utf-8"><title>SEI → Cobalto</title>
<style>
  body{font:13px/1.4 system-ui,sans-serif;width:420px;margin:0;color:#1d1d1f}
  header{background:#1f4e79;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}
  main{padding:10px 12px;max-height:440px;overflow:auto}
  h4{margin:10px 0 4px;font-size:12px;color:#555}
  .ev{display:flex;gap:6px;align-items:flex-start;padding:3px 0;border-top:1px solid #eee}
  .ev .t{flex:1;word-break:break-word}.ev.off .t{color:#999;text-decoration:line-through}
  .ev.done .t{color:#777}.tag{font-size:11px;color:#1f7a3d}
  button{cursor:pointer}.x{border:0;background:none;color:#b3261e}
  form{display:flex;gap:6px;margin-top:8px}form input[type=text]{flex:1}
  footer{padding:8px 12px;border-top:1px solid #ddd;display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:#555}
</style></head>
<body>
<header><strong>SEI → Cobalto</strong></header>
<main id="direto" style="border-bottom:1px solid #ddd">
  <strong>Botão “→ Cobalto” do SEI</strong>
  <div style="display:flex;gap:6px;margin:6px 0"><select id="acao" style="flex:1;min-width:0"></select>
    <input id="horas" type="number" min="0.5" max="24" step="0.5" value="8" style="width:56px" title="Horas lançadas no dia"><span style="align-self:center">h</span></div>
  <label style="display:block"><input type="checkbox" id="auto"> Enviar sozinho a partir das <input type="time" id="hor"></label>
  <div style="margin:6px 0"><b id="filaT">Fila de hoje</b> <button id="enviar" style="margin-left:6px">Enviar agora</button></div>
  <div id="fila" style="font-size:12px"></div>
  <div id="erro" style="font-size:12px;color:#b3261e"></div>
  <div id="hist" style="font-size:12px;margin-top:6px"></div>
</main>
<main id="acoes" style="border-bottom:1px solid #ddd">
  <div style="display:flex;align-items:center;gap:8px"><strong style="flex:1">Ações do plano no Cobalto (<span id="nAcoes">0</span>)</strong><button id="reler">Atualizar do Cobalto</button></div>
  <div id="dst" style="font-size:12px;color:#555;margin:4px 0"></div>
  <div id="listaAcoes" style="font-size:12px;max-height:180px;overflow:auto"></div>
</main>
<main style="padding-top:6px"><form id="f"><input type="text" id="ft" placeholder="Atividade manual (entra na fila de hoje)" maxlength="200"><button>Adicionar</button></form></main>
<footer>  <a href="https://cobalto.ufpel.edu.br/" target="_blank">Abrir Cobalto</a>
  <a href="#" id="opt">Opções</a></footer>
<script src="common.js"></script><script src="popup.js"></script>
</body></html>
